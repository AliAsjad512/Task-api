name: Task Api

on:
  push:
    branches:
      - main

jobs:
  task-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      services:
        postgres:
          image: postgres:16
          env:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: task_api
          ports:
            - 5432:5432
    unit-test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - run: npm ci && npm test
        - name: Run tests
          env:
            PGHOST: localhost
            PGPORT: 5432
            PGUSER: postgres
            PGPASSWORD: postgres
            PGDATABASE: task_api
          run: npm test    
    build:
      runs-on: ubuntu-latest
      needs: unit-test
      steps:
        - uses: actions/checkout@v4
        - run: npm ci && npm run dev
    deploy:
      runs-on: ubuntu-latest
      needs: build
      environment: staging
      steps:
        - uses: actions/checkout@v4
        - run: ./scripts/deploy.sh
     
