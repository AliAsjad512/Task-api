name: Task Api

on:
  push:
    branches:
      - main

jobs:
  task-api:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your required Node version
          cache: 'npm'       # Automatically cache npm dependencies
      - run: npm ci && npm test
  build:
    runs-on: ubuntu-latest
      needs: task-api
      steps:
        - uses: actions/checkout@v4
        - run:  npm run dev
  docker:
    runs-on: ubuntu-latest
    steps:   
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudhub-app:latest .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudhub-app:latest
 
      services:
        postgres:
          image: postgres:16
          env:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: task_api
          ports:
            - 5432:5432
          env:
            PGHOST: localhost
            PGPORT: 5432
            PGUSER: postgres
            PGPASSWORD: postgres
            PGDATABASE: task_api
          run: npm test    
  
  deploy:
    runs-on: ubuntu-latest
      needs: build
      environment: staging
      steps:
        - uses: actions/checkout@v4
        - run: ./scripts/deploy.sh
     
