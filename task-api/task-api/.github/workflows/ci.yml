name: Task Api

on:
  push:
    branches:
      - main

jobs:
  task-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Nodjes 
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Build app
      - run: npm ci && npm run dev
    unit-test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - run: npm ci && npm test
    
    build:
      runs-on: ubuntu-latest
      needs: unit-test
      steps:
        - uses: actions/checkout@v4
        - run: npm ci && npm run dev
    deploy:
      runs-on: ubuntu-latest
      needs: build
      environment: staging
      steps:
        - uses: actions/checkout@v4
        - run: ./scripts/deploy.sh
     
